name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Aynı dala üst üste push gelirse eski çalışmayı iptal et (koşucu tasarrufu).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Çeviri denetimi: dil listeleri tutarlı mı, her dilde bütün metinler var
      # mı, biçim belirteçleri uyuşuyor mu. Saniyeler sürer, Gradle'dan önce.
      - name: Çok dilli metin denetimi
        run: python3 tools/check_strings.py

      # Mağaza metinleri: karakter sınırları, her dilin listelemesi var mı,
      # görünmez karakter (yumuşak tire, BOM) kaçmış mı.
      - name: Mağaza metinleri denetimi
        run: python3 tools/check_store.py

      # Kelime listeleri: dil tablosu iki yerde (tools/wordlang.py ve
      # WordLang.kt) duruyor, ayrışırsa hata sessiz olur. Ayrıca listelerin
      # alfabesi, sıralaması, uzunlukları ve Dizgi harf tablosu denetlenir.
      - name: Kelime listesi denetimi
        run: python3 tools/check_wordlists.py

      - name: Site denetimi
        run: python3 tools/check_site.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Motor birim testleri
        run: ./gradlew :games:engineTests

      # Ölçüm koşumları (*Probe) geçme/kalma vermez, rapor basar; buradaki amaç
      # motorlar değiştikçe çürümelerini engellemek. Protokol: docs/oyun-testi.md
      - name: Denge ölçüm koşumları (rapor)
        run: ./gradlew probe

      - name: Robolectric önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Arayüz testleri (Robolectric + Compose)
        run: ./gradlew :app:testDebugUnitTest

      # Başarısız testlerin mesajı ve yığın izi kütükte görünsün; rapor artefaktı
      # her ortamdan indirilemiyor.
      - name: Başarısız testlerin mesajları
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True) + glob.glob('games/*/build/test-results/**/*.xml', recursive=True)
          for f in files:
              root = ET.parse(f).getroot()
              for tc in root.findall('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print(f"::group::{root.get('name')}.{tc.get('name')}")
                      print((fl.get('message') or '')[:2000])
                      print((fl.text or '')[:4000])
                      print('::endgroup::')
          EOF

      - name: Test raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: za-test-reports
          path: |
            app/build/reports/tests
            app/build/test-results

      - name: Debug APK derle
        run: ./gradlew :app:assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: za-debug-apk
          path: app/build/outputs/apk/debug/*.apk
