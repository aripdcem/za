name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Aynı dala üst üste push gelirse eski çalışmayı iptal et (koşucu tasarrufu).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Motor birim testleri
        run: ./gradlew :games:tetris:test :games:g2048:test :games:snake:test :games:sudoku:test :games:mines:test :games:besharf:test :games:kiskac:test :games:turetme:test :games:dizgi:test :games:kuyu:test :games:gecit:test :games:tavla:test :games:balkon:test

      - name: Debug APK derle
        run: ./gradlew :app:assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: za-debug-apk
          path: app/build/outputs/apk/debug/*.apk
