name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

# Aynı dala üst üste push gelirse eski çalışmayı iptal et (koşucu tasarrufu).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Motor birim testleri
        run: ./gradlew :games:tetris:test :games:g2048:test :games:snake:test :games:sudoku:test :games:mines:test :games:besharf:test :games:kiskac:test :games:turetme:test :games:dizgi:test :games:kuyu:test :games:gecit:test :games:tavla:test :games:balkon:test :games:kakuro:test :games:sayi:test :games:viraj:test :games:filo:test :games:reyon:test :games:raket:test :games:tuse:test :games:ucurtma:test :games:dalgic:test

      # Ölçüm koşumları (*Probe) geçme/kalma vermez, rapor basar; buradaki amaç
      # motorlar değiştikçe çürümelerini engellemek. Protokol: docs/oyun-testi.md
      - name: Denge ölçüm koşumları (rapor)
        run: ./gradlew probe

      - name: Robolectric önbelleği
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Arayüz testleri (Robolectric + Compose)
        run: ./gradlew :app:testDebugUnitTest

      # Başarısız testlerin mesajı ve yığın izi kütükte görünsün; rapor artefaktı
      # her ortamdan indirilemiyor.
      - name: Başarısız testlerin mesajları
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('app/build/test-results/**/*.xml', recursive=True) + glob.glob('games/*/build/test-results/**/*.xml', recursive=True)
          for f in files:
              root = ET.parse(f).getroot()
              for tc in root.findall('testcase'):
                  for fl in list(tc.findall('failure')) + list(tc.findall('error')):
                      print(f"::group::{root.get('name')}.{tc.get('name')}")
                      print((fl.get('message') or '')[:2000])
                      print((fl.text or '')[:4000])
                      print('::endgroup::')
          EOF

      - name: Test raporlarını yükle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: za-test-reports
          path: |
            app/build/reports/tests
            app/build/test-results

      - name: Debug APK derle
        run: ./gradlew :app:assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: za-debug-apk
          path: app/build/outputs/apk/debug/*.apk
