name: Release

# İmzalı APK üretimi. `v*` etiketi push'lanınca çalışır, APK'yı GitHub
# Release'e `za.apk` adıyla ekler; Pages sitesindeki indirme bağlantısı
# releases/latest/download/za.apk adresinden her zaman en yeni sürümü verir.
#
# Gerekli secret'lar (depo sahibi ayarlar):
#   ANDROID_KEYSTORE_BASE64   — base64 kodlu za-release.jks
#   ANDROID_KEYSTORE_PASSWORD — keystore parolası (alias: za)

on:
  push:
    tags: ['v*']
    # İş akışı değişince imzalı derlemeyi doğrula (Release oluşturmaz).
    branches: [main, 'claude/**']
    paths: ['.github/workflows/release.yml']
  # Elle tetikleme: verilen etiketi ve Release'i iş akışı kendisi oluşturur.
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Oluşturulacak sürüm etiketi (örn. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Motor birim testleri
        run: ./gradlew :games:tetris:test :games:g2048:test :games:snake:test :games:sudoku:test :games:mines:test :games:besharf:test :games:kiskac:test :games:turetme:test

      - name: Sürümü etiketten türet
        id: version
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          case "$TAG" in
            v[0-9]*) ;;
            *) TAG="v0.0.1" ;; # dal push'u = yalnızca doğrulama derlemesi
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Keystore'u çöz
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/za-release.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: İmzalı release APK derle
        run: ./gradlew :app:assembleRelease -PzaVersion=${{ steps.version.outputs.version }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/za-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Yayın dosyalarını hazırla (APK + kaynak arşivleri + SHA256)
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/za-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk dist/za.apk
          git archive --format=zip --prefix="za-$TAG/" -o "dist/za-$TAG-source.zip" HEAD
          git archive --format=tar.gz --prefix="za-$TAG/" -o "dist/za-$TAG-source.tar.gz" HEAD
          cd dist && sha256sum za* > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Yayın dosyalarını iş akışı çıktısı olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: za-release-${{ steps.version.outputs.tag }}
          path: dist/*

      - name: GitHub Release oluştur
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
