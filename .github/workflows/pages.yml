name: Pages

# site/ klasörünü GitHub Pages'e yayınlar (za.aripd.com).
# Depo ayarlarında Pages kaynağı "GitHub Actions" olmalı; özel alan adı
# za.aripd.com Settings → Pages'ten tanımlanır (DNS: CNAME → aripdcem.github.io).

on:
  push:
    # github-pages ortamı yalnızca varsayılan daldan (main) dağıtıma izin verir.
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
